twig:
    globals:
        site_theme: '@App\Service\SiteTheme'
        portal_navigation: '@App\Service\PortalNavigation'
        admin_club_context: '@App\Service\AdminClubContext'
        editorial_access: '@App\Security\EditorialAccess'
        club_function_membership_enabled: '%env(bool:CLUB_FUNCTION_MEMBERSHIP_ENABLED)%'
    default_path: '%kernel.project_dir%/templates'
    date:
        format: 'd.m.Y H:i'
        interval_format: '%d days'
        timezone: null
    number_format:
        decimals: 2
        decimal_point: ','
        thousands_separator: '.'
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'

when@test:
    twig:
        strict_variables: true
